name: Release XPscript VS Code plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "SHOULD_RELEASE=false" >> "$GITHUB_ENV"
            echo "Release $tag already exists. Nothing to publish."
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout XPscript source
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/checkout@v4
        with:
          repository: xpagedeveloper/XPscript
          path: xpscript-source

      - name: Setup Node.js
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: env.SHOULD_RELEASE == 'true'
        run: npm install

      - name: Compile and package
        if: env.SHOULD_RELEASE == 'true'
        env:
          XPSCRIPT_REPO_PATH: ${{ github.workspace }}/xpscript-source
          XPSCRIPT_ASTRO_DOCS_PATH: ${{ github.workspace }}/xpscript-source
        run: npm run package

      - name: Rename VSIX for release
        if: env.SHOULD_RELEASE == 'true'
        shell: bash
        run: mv publish/xpscript.vsix "publish/xpscript-${VERSION}.vsix"

      - name: Create version tag
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "publish/xpscript-${VERSION}.vsix" \
            --target "$GITHUB_SHA" \
            --title "XPscript $TAG" \
            --generate-notes
