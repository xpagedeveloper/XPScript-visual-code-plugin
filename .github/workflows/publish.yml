name: Build XPscript VS Code plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile and package
        run: npm run package

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: xpscript-vscode-${{ github.sha }}
          path: publish/
          if-no-files-found: error
          retention-days: 30
